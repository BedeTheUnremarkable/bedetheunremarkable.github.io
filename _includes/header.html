<header id="l-header">
    <div class="container">
        <div class="row logo">
            <div class="col-lg-7">
                <h1>{{ site.name }}</h1>
            </div>

            <div class="col-lg-5">
              {% for line in site.shout %}
                <p>{{ line }}</p>
              {% endfor %}
            </div>
        </div>

        <div class="row navicon">
            <a href=""><i class="fa fa-navicon"></i></a>
        </div>

        <div class="row navbar">
            <nav class="col-lg-8 col-md-8 col-xs-12" aria-label="Main navigation">
                <ul class="row">
                    <li class="col-lg-3"><a href="{{ '/' | relative_url }}">HOME</a></li>
                    <li class="col-lg-3"><a href="{{ '/writing/' | relative_url }}">WRITING</a></li>
                    <li class="col-lg-3"><a href="{{ '/art/' | relative_url }}">ART</a></li>
                    <li class="col-lg-3"><a href="{{ '/about' | relative_url }}">ABOUT</a></li>
                </ul>
            </nav>

            <div class="search col-lg-4 col-md-4 col-xs-12">
                <form>
                    <input id="search-input" name="search" type="search" aria-label="Search blog posts" placeholder="Search Blog Posts...">
                    <i class="fa fa-search"></i>
                </form>
            </div>
        </div>
    </div>
</header>
